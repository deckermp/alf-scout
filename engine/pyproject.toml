[project]
name = "alf-atlas"
version = "0.1.0"
description = "ZIP-code senior-living market research: a LangGraph pipeline in a Claude Agent SDK harness that learns from human corrections"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.128",
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "langgraph>=0.2",
    "pydantic>=2",
    "rapidfuzz>=3.14.5",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
